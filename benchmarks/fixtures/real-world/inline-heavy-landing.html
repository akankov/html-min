<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inline-heavy landing page</title>
  <style>
    /* Critical CSS inlined for first paint */
    :root {
      --brand: #1a73e8;
      --ink: #202124;
      --paper: #ffffff;
      --radius: 8px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.5;
    }
    .hero {
      padding: 64px 24px;
      text-align: center;
      background: linear-gradient(180deg, #f8f9fa 0%, #ffffff 100%);
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin: 0 0 16px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: var(--radius);
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(26, 115, 232, 0.35); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      padding: 48px 24px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      border: 1px solid #e0e0e0;
      border-radius: var(--radius);
      padding: 20px;
    }
    @media (min-width: 768px) {
      .hero { padding: 96px 24px; }
    }
    .bg {
      background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciLz4=");
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>Build faster sites</h1>
    <p>Ship minified HTML, CSS, and JS straight from PHP.</p>
    <a class="btn" href="/get-started">Get started</a>
  </header>

  <main class="grid">
    <section class="card"><h2>Fast</h2><p>Native DOMDocument pipeline.</p></section>
    <section class="card"><h2>Safe</h2><p>ASI-aware, string-aware minifiers.</p></section>
    <section class="card"><h2>Composable</h2><p>Twig and Laravel bindings.</p></section>
  </main>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "html-min",
    "description": "HTML compressor and minifier for PHP"
  }
  </script>

  <script>
    // Progressive enhancement bootstrap
    (function () {
      'use strict';
      var doc = document;
      var root = doc.documentElement;
      root.className = root.className.replace(/\bno-js\b/, '') + ' js';

      function onReady(fn) {
        if (/^(complete|interactive)$/.test(doc.readyState)) {
          fn();
        } else {
          doc.addEventListener('DOMContentLoaded', fn);
        }
      }

      onReady(function () {
        var buttons = doc.querySelectorAll('.btn');
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].addEventListener('click', function (event) {
            var href = this.getAttribute('href');
            if (href && href.charAt(0) === '#') {
              event.preventDefault();
              var target = doc.querySelector(href);
              if (target) {
                target.scrollIntoView({ behavior: 'smooth' });
              }
            }
          });
        }
      });
    })();
  </script>
</body>
</html>
